[project]
name = "megalion-http"
version = "0.0.1"
authors = [
  { name="Klara Modin", email="klarasmodin@gmail.com" },
]
description = "Expose the Megalion HTTP API to python"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/klarasm/megalion-http"
Issues = "https://github.com/klarasm/megalion-http/issues"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"
